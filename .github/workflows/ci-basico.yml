name: CI Basico

on:
  push:
    branches:
      - main
      - testing
      - "feature/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
        matrix:
          os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: proy_constr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proy_constr/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generar Prisma Client (inicializa la base de datos)
        run: npm run prisma:generate --workspace backend

      - name: Build frontend
        run: npm run build
