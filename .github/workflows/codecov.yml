name: Coverage and Codecov

on:
  push:
    branches:
      - main
      - testing
      - "feature/**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.1-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: proy_constr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proy_constr/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client for backend
        run: npm run prisma:generate --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres?schema=public

      - name: Apply Prisma migrations for backend
        run: npx prisma migrate deploy
        working-directory: proy_constr/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres?schema=public

      - name: Run frontend coverage
        run: npm run coverage

      - name: Run backend coverage
        run: npm run test:coverage --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres?schema=public

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./proy_constr/frontend/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./proy_constr/backend/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
