name: Coverage and Codecov

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proy_constr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proy_constr/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run frontend coverage
        run: npm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./proy_constr/frontend/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
