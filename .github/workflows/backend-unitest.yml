name: Backend Unit Tests

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - testing
      - "feature/**"

jobs:
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: proy_constr

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proy_constr/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend
        env:
          DATABASE_URL: ${{ secrets.BD_URL }}

      - name: Run backend tests with coverage
        run: npm exec --workspace backend vitest run --coverage
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./proy_constr/backend/coverage/lcov.info
          fail_ci_if_error: true
