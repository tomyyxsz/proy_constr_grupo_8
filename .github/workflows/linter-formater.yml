name: Linter Workflow

on:
  pull_request:
    branches:
      - "**"

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: proy_constr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proy_constr/package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Correr linter
        run: |
          npm run lint --workspace frontend --if-present
          npm run lint --workspace backend --if-present

      - name: Correr tests
        run: |
          npm run test:run --workspace frontend --if-present
          npm run test:run --workspace backend --if-present